<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW TRANSMITTER</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b10;
 color:white;
 font-family:Arial,sans-serif;
}
.app{
 width:min(900px,94%);
 margin:auto;
 padding:15px;
}
h1{text-align:center;letter-spacing:3px}
.card{
 background:#111720;
 border:1px solid #293444;
 border-radius:16px;
 padding:16px;
 margin:12px 0;
}
input,button{
 width:100%;
 padding:12px;
 margin:5px 0;
 border-radius:9px;
 border:1px solid #344154;
 background:#0a1017;
 color:white;
}
button{background:#172235;font-weight:bold}
button:active{transform:scale(.98)}
#player{
 width:100%;
 aspect-ratio:16/9;
 background:#000;
}
.result{
 padding:11px;
 margin:5px 0;
 border:1px solid #293444;
 border-radius:8px;
 cursor:pointer;
}
.status{
 padding:11px;
 background:#080c12;
 border-radius:8px;
 margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<h1>AVEDOW TRANSMITTER</h1>

<div class="card">

<h3>ROOM</h3>

<input id="room" placeholder="Kode room, contoh AVEDOW123">

<button onclick="connectRoom()">
🔗 HUBUNGKAN RECEIVER
</button>

<div id="status" class="status">
Belum terhubung
</div>

</div>


<div class="card">

<h3>YOUTUBE</h3>

<input
 id="youtubeKey"
 placeholder="YouTube Data API v3 Key"
>

<input
 id="search"
 placeholder="Cari lagu/video YouTube"
>

<button onclick="searchYouTube()">
🔎 CARI
</button>

<div id="results"></div>

</div>


<div class="card">

<h3>PLAYER</h3>

<div id="player"></div>

<button onclick="playVideo()">▶ PLAY</button>
<button onclick="pauseVideo()">⏸ PAUSE</button>
<button onclick="previousVideo()">⏮ PREVIOUS</button>
<button onclick="nextVideo()">⏭ NEXT</button>

<label>VOLUME</label>

<input
 id="volume"
 type="range"
 min="0"
 max="100"
 value="100"
 oninput="changeVolume(this.value)"
>

</div>


<div class="card">

<h3>AUDIO TRANSMISSION</h3>

<button onclick="startAudio()">
🎙 AKTIFKAN AUDIO
</button>

<button onclick="stopAudio()">
⛔ MATIKAN AUDIO
</button>

<div id="audioStatus" class="status">
Audio belum dikirim
</div>

</div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =================================================
   ISI DENGAN FIREBASE CONFIG MILIKMU
   ================================================= */

const firebaseConfig = {
  apiKey: "ISI_API_KEY_FIREBASE",
  authDomain: "ISI_PROJECT.firebaseapp.com",
  databaseURL: "https://ISI_PROJECT-default-rtdb.firebaseio.com",
  projectId: "ISI_PROJECT",
  storageBucket: "ISI_PROJECT.appspot.com",
  messagingSenderId: "ISI_SENDER_ID",
  appId: "ISI_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* ================================================= */

let room="";
let player=null;
let playlist=[];
let current=0;

let pc=null;
let localStream=null;


/* ================= YOUTUBE ================= */

function onYouTubeIframeAPIReady(){

 player=new YT.Player("player",{
   videoId:"",
   playerVars:{
     playsinline:1,
     controls:1
   }
 });

}


async function searchYouTube(){

 const key=document.getElementById("youtubeKey").value.trim();
 const query=document.getElementById("search").value.trim();

 if(!key){
   alert("Masukkan YouTube API Key.");
   return;
 }

 if(!query){
   alert("Masukkan pencarian.");
   return;
 }

 const url=
 "https://www.googleapis.com/youtube/v3/search"+
 "?part=snippet"+
 "&type=video"+
 "&maxResults=10"+
 "&q="+encodeURIComponent(query)+
 "&key="+encodeURIComponent(key);

 try{

   const response=await fetch(url);
   const data=await response.json();

   const box=document.getElementById("results");
   box.innerHTML="";

   if(!data.items){
     box.innerHTML="<p>Tidak ada hasil.</p>";
     return;
   }

   data.items.forEach(item=>{

     const id=item.id.videoId;

     const div=document.createElement("div");
     div.className="result";

     div.textContent=item.snippet.title;

     div.onclick=()=>{

       playlist.push(id);
       current=playlist.length-1;

       player.loadVideoById(id);

       sendCommand({
         type:"load",
         videoId:id
       });

     };

     box.appendChild(div);

   });

 }catch(e){

   alert("Gagal mencari YouTube.");
   console.error(e);

 }

}


function playVideo(){

 if(player) player.playVideo();

 sendCommand({type:"play"});
}


function pauseVideo(){

 if(player) player.pauseVideo();

 sendCommand({type:"pause"});
}


function previousVideo(){

 if(!playlist.length)return;

 current--;

 if(current<0)
   current=playlist.length-1;

 player.loadVideoById(
   playlist[current]
 );

 sendCommand({
   type:"load",
   videoId:playlist[current]
 });

}


function nextVideo(){

 if(!playlist.length)return;

 current++;

 if(current>=playlist.length)
   current=0;

 player.loadVideoById(
   playlist[current]
 );

 sendCommand({
   type:"load",
   videoId:playlist[current]
 });

}


function changeVolume(value){

 if(player)
   player.setVolume(Number(value));

 sendCommand({
   type:"volume",
   value:Number(value)
 });

}


/* ================= FIREBASE ROOM ================= */

function connectRoom(){

 room=document.getElementById("room").value.trim();

 if(!room){
   alert("Masukkan kode room.");
   return;
 }

 const ref=db.ref("avedow/"+room+"/transmitter");

 ref.set({
   online:true,
   time:Date.now()
 });

 document.getElementById("status").textContent=
   "Room aktif. Menunggu Receiver...";

 listenReceiver();

}


function listenReceiver(){

 db.ref("avedow/"+room+"/receiver/answer")
 .on("value",async snap=>{

   const answer=snap.val();

   if(!answer || !pc)return;

   if(pc.signalingState!=="stable"){

     try{
       await pc.setRemoteDescription(
         new RTCSessionDescription(answer)
       );

       document.getElementById("status").textContent=
         "Receiver terhubung.";

     }catch(e){
       console.error(e);
     }

   }

 });

}


/* ================= WEBRTC ================= */

async function startAudio(){

 if(!room){
   alert("Hubungkan room dahulu.");
   return;
 }

 try{

   localStream=
   await navigator.mediaDevices.getDisplayMedia({
     video:true,
     audio:true
   });

   const audioTracks=
     localStream.getAudioTracks();

   if(!audioTracks.length){

     alert(
       "Audio tidak tertangkap. Saat Share Screen pilih Share audio."
     );

     return;
   }


   pc=new RTCPeerConnection({
     iceServers:[
       {
         urls:"stun:stun.l.google.com:19302"
       }
     ]
   });


   audioTracks.forEach(track=>{
     pc.addTrack(track,localStream);
   });


   pc.onicecandidate=event=>{

     if(event.candidate){

       db.ref(
         "avedow/"+room+
         "/transmitter/candidates"
       ).push(
         event.candidate.toJSON()
       );

     }

   };


   const offer=
     await pc.createOffer();

   await pc.setLocalDescription(offer);


   await db.ref(
     "avedow/"+room+
     "/transmitter/offer"
   ).set({
     type:offer.type,
     sdp:offer.sdp
   });


   db.ref(
     "avedow/"+room+
     "/receiver/candidates"
   ).on("child_added",async snap=>{

     try{

       await pc.addIceCandidate(
         new RTCIceCandidate(
           snap.val()
         )
       );

     }catch(e){
       console.error(e);
     }

   });


   document.getElementById(
     "audioStatus"
   ).textContent=
     "AUDIO STREAM AKTIF";


   document.getElementById(
     "status"
   ).textContent=
     "Menunggu koneksi Receiver...";


 }catch(e){

   console.error(e);

   document.getElementById(
     "audioStatus"
   ).textContent=
     "Gagal: "+e.message;

 }

}


function stopAudio(){

 if(localStream){

   localStream.getTracks().forEach(
     track=>track.stop()
   );

   localStream=null;
 }

 if(pc){

   pc.close();
   pc=null;
 }

 if(room){

   db.ref(
     "avedow/"+room+
     "/transmitter/offer"
   ).remove();

 }

 document.getElementById(
   "audioStatus"
 ).textContent=
   "Audio dihentikan.";

}


/* ================= CONTROL ================= */

function sendCommand(command){

 if(!room)return;

 db.ref(
   "avedow/"+room+
   "/commands"
 ).push({
   ...command,
   time:Date.now()
 });

}

</script>

</body>
</html>
