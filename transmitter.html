<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW TRANSMITTER</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080b10;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
}
.box{
  max-width:600px;
  margin:auto;
  background:#11161d;
  border:1px solid #29313c;
  border-radius:18px;
  padding:20px;
}
h1{
  text-align:center;
  color:#00e5ff;
}
input,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #394451;
  background:#080b10;
  color:white;
  font-size:16px;
}
button{
  background:#008fa3;
  border:0;
  font-weight:bold;
}
.status{
  margin-top:18px;
  padding:18px;
  border-radius:12px;
  text-align:center;
  background:#191f27;
  font-size:20px;
  font-weight:bold;
}
.log{
  margin-top:15px;
  background:#05070a;
  padding:12px;
  border-radius:10px;
  height:180px;
  overflow:auto;
  font-size:13px;
  color:#9defff;
}
</style>
</head>

<body>

<div class="box">

<h1>AVEDOW TRANSMITTER</h1>

<input id="room" placeholder="Masukkan ROOM, contoh: AVEDOW123">

<button id="connectBtn">HUBUNGKAN RECEIVER</button>

<div id="status" class="status">
🔴 OFFLINE
</div>

<button id="captureBtn">
AKTIFKAN AUDIO STREAM
</button>

<div id="log" class="log"></div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  onValue,
  push,
  remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================================
   MASUKKAN FIREBASE CONFIG KAMU DI SINI
========================================= */

const firebaseConfig = {
  apiKey: "ISI_API_KEY",
  authDomain: "ISI_PROJECT.firebaseapp.com",
  databaseURL: "https://ISI_PROJECT-default-rtdb.firebaseio.com",
  projectId: "ISI_PROJECT",
  storageBucket: "ISI_PROJECT.appspot.com",
  messagingSenderId: "ISI_SENDER_ID",
  appId: "ISI_APP_ID"
};


/* ========================================= */

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let pc = null;
let localStream = null;
let roomCode = "";
let connected = false;

const statusBox = document.getElementById("status");
const logBox = document.getElementById("log");


function log(text){
  const time = new Date().toLocaleTimeString();
  logBox.innerHTML += `[${time}] ${text}<br>`;
  logBox.scrollTop = logBox.scrollHeight;
}


function status(text){
  statusBox.textContent = text;
}


function setConnectionState(state){

  if(state === "waiting"){
    status("🟡 MENUNGGU RECEIVER");
  }

  if(state === "connecting"){
    status("🔵 MENGHUBUNGKAN...");
  }

  if(state === "connected"){
    status("🟢 TERHUBUNG");
    connected = true;
  }

  if(state === "disconnected"){
    status("🔴 TERPUTUS");
    connected = false;
  }
}


/* =========================================
   BUAT WEBRTC
========================================= */

async function createConnection(){

  roomCode =
    document.getElementById("room").value.trim();

  if(!roomCode){
    alert("Masukkan ROOM terlebih dahulu");
    return;
  }

  setConnectionState("waiting");

  log("Membuat koneksi WebRTC...");
  
  pc = new RTCPeerConnection({
    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]
  });


  pc.onconnectionstatechange = () => {

    log("WebRTC: " + pc.connectionState);

    if(pc.connectionState === "connecting"){
      setConnectionState("connecting");
    }

    if(pc.connectionState === "connected"){
      setConnectionState("connected");
    }

    if(
      pc.connectionState === "disconnected" ||
      pc.connectionState === "failed" ||
      pc.connectionState === "closed"
    ){
      setConnectionState("disconnected");
    }
  };


  pc.oniceconnectionstatechange = () => {
    log("ICE: " + pc.iceConnectionState);
  };


  /* ICE transmitter */

  pc.onicecandidate = async event => {

    if(event.candidate){

      await push(
        ref(
          db,
          `avedow/${roomCode}/transmitterCandidates`
        ),
        event.candidate.toJSON()
      );

    }

  };


  /* Tunggu answer dari receiver */

  onValue(
    ref(
      db,
      `avedow/${roomCode}/receiverAnswer`
    ),
    async snapshot => {

      const answer = snapshot.val();

      if(
        answer &&
        pc &&
        pc.signalingState !== "stable"
      ){

        log("Answer RECEIVER diterima");

        await pc.setRemoteDescription(
          new RTCSessionDescription(answer)
        );

      }

    }
  );


  /* Terima ICE candidate dari receiver */

  onValue(
    ref(
      db,
      `avedow/${roomCode}/receiverCandidates`
    ),
    async snapshot => {

      const data = snapshot.val();

      if(!data) return;

      for(const key in data){

        try{

          await pc.addIceCandidate(
            new RTCIceCandidate(data[key])
          );

        }catch(e){

          console.log(e);

        }

      }

    }
  );


  /* Buat OFFER */

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(offer);


  await set(
    ref(
      db,
      `avedow/${roomCode}/transmitterOffer`
    ),
    {
      type: offer.type,
      sdp: offer.sdp
    }
  );


  log("OFFER dikirim");
  log("Sekarang buka RECEIVER dengan ROOM yang sama");

}


/* =========================================
   AUDIO CAPTURE
========================================= */

async function startAudio(){

  if(!pc){
    alert("Hubungkan receiver terlebih dahulu");
    return;
  }


  try{

    localStream =
      await navigator.mediaDevices.getDisplayMedia({

        video:true,
        audio:true

      });


    const tracks =
      localStream.getAudioTracks();


    if(tracks.length === 0){

      alert(
        "Browser tidak memberikan audio. Saat memilih layar/tab, aktifkan SHARE AUDIO jika tersedia."
      );

      log("Tidak ada audio track");

      return;
    }


    tracks.forEach(track => {

      pc.addTrack(
        track,
        localStream
      );

    });


    log("Audio track berhasil ditambahkan");


    /* Jika user menghentikan capture */

    tracks[0].onended = () => {

      log("Audio capture dihentikan");

    };

  }catch(error){

    log("Gagal capture: " + error.message);

    alert(error.message);

  }

}


document
  .getElementById("connectBtn")
  .onclick = createConnection;


document
  .getElementById("captureBtn")
  .onclick = startAudio;

</script>

</body>
</html>
