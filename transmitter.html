<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW TRANSMITTER</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b10;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.box{
  max-width:600px;
  margin:auto;
  background:#11161d;
  border:1px solid #29313c;
  border-radius:18px;
  padding:20px;
}

h1{
  text-align:center;
  color:#00e5ff;
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#008fa3;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.status{
  margin-top:18px;
  padding:18px;
  border-radius:12px;
  text-align:center;
  background:#191f27;
  font-size:20px;
  font-weight:bold;
}

.log{
  margin-top:15px;
  background:#05070a;
  padding:12px;
  border-radius:10px;
  height:180px;
  overflow:auto;
  font-size:13px;
  color:#9defff;
}
</style>
</head>

<body>

<div class="box">

<h1>AVEDOW TRANSMITTER</h1>

<div id="status" class="status">
🔴 BELUM TERHUBUNG
</div>

<button id="connect">
🔗 HUBUNGKAN RECEIVER
</button>

<button id="audioBtn">
🎵 AKTIFKAN AUDIO
</button>

<div id="log" class="log"></div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================
   ISI FIREBASE CONFIG KAMU
===================================== */

const firebaseConfig = {

  apiKey: "ISI_API_KEY",

  authDomain:
    "ISI_PROJECT.firebaseapp.com",

  databaseURL:
    "https://ISI_PROJECT-default-rtdb.firebaseio.com",

  projectId:
    "ISI_PROJECT",

  storageBucket:
    "ISI_PROJECT.appspot.com",

  messagingSenderId:
    "ISI_SENDER_ID",

  appId:
    "ISI_APP_ID"

};


/* =====================================
   CHANNEL AVEDOW
   TIDAK PERLU DIISI USER
===================================== */

const CHANNEL = "AVEDOW_AUDIO_MAIN";


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


let pc = null;
let stream = null;


const status =
  document.getElementById("status");

const logBox =
  document.getElementById("log");


function log(text){

  const waktu =
    new Date().toLocaleTimeString();

  logBox.innerHTML +=
    `[${waktu}] ${text}<br>`;

  logBox.scrollTop =
    logBox.scrollHeight;
}


function setStatus(text){

  status.textContent = text;

}


/* =====================================
   HUBUNGKAN
===================================== */

async function connect(){

  setStatus("🟡 MENCARI RECEIVER");

  log("Mencari receiver...");


  pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
          "stun:stun.l.google.com:19302"
        }
      ]

    });


  pc.onconnectionstatechange = () => {

    log(
      "Koneksi: " +
      pc.connectionState
    );


    if(
      pc.connectionState ===
      "connecting"
    ){

      setStatus(
        "🔵 MENGHUBUNGKAN..."
      );

    }


    if(
      pc.connectionState ===
      "connected"
    ){

      setStatus(
        "🟢 TERHUBUNG"
      );

    }


    if(
      pc.connectionState ===
      "disconnected" ||
      pc.connectionState ===
      "failed"
    ){

      setStatus(
        "🔴 TERPUTUS"
      );

    }

  };


  /* ICE transmitter */

  pc.onicecandidate =
  async event => {

    if(!event.candidate)
      return;


    await push(

      ref(
        db,
        `avedow/${CHANNEL}/txCandidates`
      ),

      event.candidate.toJSON()

    );

  };


  /* Dengarkan answer */

  onValue(

    ref(
      db,
      `avedow/${CHANNEL}/answer`
    ),

    async snapshot => {

      const answer =
        snapshot.val();

      if(!answer)
        return;


      if(
        pc.signalingState !==
        "stable"
      ){

        await pc.setRemoteDescription(
          answer
        );

        log(
          "Receiver ditemukan!"
        );

      }

    }

  );


  /* Dengarkan ICE receiver */

  onValue(

    ref(
      db,
      `avedow/${CHANNEL}/rxCandidates`
    ),

    async snapshot => {

      const data =
        snapshot.val();

      if(!data)
        return;


      for(
        const key in data
      ){

        try{

          await pc.addIceCandidate(
            data[key]
          );

        }catch(e){}

      }

    }

  );


  /* Buat offer */

  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  await set(

    ref(
      db,
      `avedow/${CHANNEL}/offer`
    ),

    {
      type:offer.type,
      sdp:offer.sdp
    }

  );


  log("Menunggu receiver...");

}


/* =====================================
   AUDIO
===================================== */

async function startAudio(){

  if(!pc){

    alert(
      "Tekan HUBUNGKAN RECEIVER dahulu."
    );

    return;

  }


  try{

    stream =
      await navigator.mediaDevices
      .getDisplayMedia({

        video:true,
        audio:true

      });


    const tracks =
      stream.getAudioTracks();


    if(tracks.length === 0){

      alert(
        "Audio tidak tersedia. Saat memilih layar/tab, aktifkan Share Audio jika tersedia."
      );

      return;

    }


    tracks.forEach(track => {

      pc.addTrack(
        track,
        stream
      );

    });


    log(
      "Audio berhasil dikirim."
    );


  }catch(error){

    log(
      "Audio gagal: " +
      error.message
    );

  }

}


document
  .getElementById("connect")
  .onclick =
  connect;


document
  .getElementById("audioBtn")
  .onclick =
  startAudio;

</script>

</body>
</html>
