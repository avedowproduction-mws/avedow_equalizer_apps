<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AVEDOW TRANSMITTER</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080b10;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(900px,94%);
    margin:auto;
    padding:20px 0;
}

h1{
    text-align:center;
    letter-spacing:4px;
}

.card{
    background:#111720;
    border:1px solid #293444;
    border-radius:16px;
    padding:18px;
    margin:15px 0;
}

input,button{
    width:100%;
    padding:13px;
    margin:6px 0;
    border-radius:9px;
    border:1px solid #344154;
    background:#0b1017;
    color:white;
}

button{
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#1b2a40;
}

#player{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
}

.result{
    padding:10px;
    margin:5px 0;
    border:1px solid #283445;
    border-radius:8px;
    cursor:pointer;
}

.status{
    padding:12px;
    background:#080c12;
    border-radius:8px;
    margin-top:10px;
}

video{
    width:100%;
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>AVEDOW TRANSMITTER</h1>

<div class="card">

<h3>ROOM</h3>

<input
id="roomCode"
placeholder="Masukkan kode room RECEIVER">

<button onclick="connectRoom()">
🔗 CONNECT RECEIVER
</button>

<div id="connectionStatus" class="status">
Belum tersambung
</div>

</div>


<div class="card">

<h3>YOUTUBE</h3>

<input
id="youtubeKey"
placeholder="YouTube Data API v3 Key">

<input
id="search"
placeholder="Cari lagu YouTube">

<button onclick="searchYouTube()">
🔎 CARI
</button>

<div id="results"></div>

</div>


<div class="card">

<h3>PLAYER</h3>

<div id="player"></div>

<button onclick="playVideo()">▶ PLAY</button>

<button onclick="pauseVideo()">⏸ PAUSE</button>

<button onclick="previousVideo()">⏮ PREVIOUS</button>

<button onclick="nextVideo()">⏭ NEXT</button>

<label>VOLUME</label>

<input
type="range"
min="0"
max="100"
value="100"
oninput="changeVolume(this.value)"
>

</div>


<div class="card">

<h3>AUDIO TRANSMISSION</h3>

<button onclick="startCapture()">
🎙 AKTIFKAN AUDIO STREAM
</button>

<button onclick="stopCapture()">
⛔ STOP STREAM
</button>

<div id="streamStatus" class="status">
Stream belum aktif
</div>

</div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

let youtubePlayer;

let videos=[];
let currentVideo=0;

let peerConnection=null;
let capturedStream=null;


// ===========================
// YOUTUBE
// ===========================

function onYouTubeIframeAPIReady(){

    youtubePlayer=new YT.Player(
        "player",
        {
            videoId:"",
            playerVars:{
                playsinline:1,
                controls:1
            }
        }
    );

}


async function searchYouTube(){

    const key=
        document.getElementById("youtubeKey").value.trim();

    const query=
        document.getElementById("search").value.trim();

    if(!key){
        alert("Masukkan YouTube API Key.");
        return;
    }

    if(!query){
        alert("Masukkan pencarian.");
        return;
    }

    const url=
        "https://www.googleapis.com/youtube/v3/search"+
        "?part=snippet"+
        "&type=video"+
        "&maxResults=10"+
        "&q="+encodeURIComponent(query)+
        "&key="+encodeURIComponent(key);

    try{

        const response=
            await fetch(url);

        const data=
            await response.json();

        const results=
            document.getElementById("results");

        results.innerHTML="";

        if(!data.items){
            results.innerHTML=
                "<p>Hasil tidak ditemukan.</p>";
            return;
        }

        data.items.forEach(item=>{

            const videoId=
                item.id.videoId;

            const div=
                document.createElement("div");

            div.className="result";

            div.textContent=
                item.snippet.title;

            div.onclick=()=>{

                videos.push(videoId);

                currentVideo=
                    videos.length-1;

                youtubePlayer.loadVideoById(
                    videoId
                );

            };

            results.appendChild(div);

        });

    }catch(error){

        console.error(error);

        alert("Gagal mengakses YouTube API.");

    }

}


function playVideo(){

    if(youtubePlayer)
        youtubePlayer.playVideo();

}


function pauseVideo(){

    if(youtubePlayer)
        youtubePlayer.pauseVideo();

}


function previousVideo(){

    if(videos.length===0)return;

    currentVideo--;

    if(currentVideo<0)
        currentVideo=videos.length-1;

    youtubePlayer.loadVideoById(
        videos[currentVideo]
    );

}


function nextVideo(){

    if(videos.length===0)return;

    currentVideo++;

    if(currentVideo>=videos.length)
        currentVideo=0;

    youtubePlayer.loadVideoById(
        videos[currentVideo]
    );

}


function changeVolume(value){

    if(youtubePlayer)
        youtubePlayer.setVolume(
            Number(value)
        );

}


// ===========================
// WEBRTC
// ===========================

async function connectRoom(){

    const room=
        document.getElementById("roomCode")
        .value.trim();

    if(!room){

        alert("Masukkan kode room.");

        return;

    }

    document.getElementById(
        "connectionStatus"
    ).textContent=
        "Room siap. Menunggu Receiver...";

}


// ===========================
// AUDIO CAPTURE
// ===========================

async function startCapture(){

    try{

        capturedStream=
            await navigator.mediaDevices
            .getDisplayMedia({

                video:true,
                audio:true

            });


        const audioTracks=
            capturedStream.getAudioTracks();


        if(audioTracks.length===0){

            document.getElementById(
                "streamStatus"
            ).textContent=
                "Audio tidak tertangkap. Pilih opsi SHARE AUDIO jika tersedia.";

            return;

        }


        peerConnection=
            new RTCPeerConnection({

                iceServers:[
                    {
                        urls:
                        "stun:stun.l.google.com:19302"
                    }
                ]

            });


        audioTracks.forEach(track=>{

            peerConnection.addTrack(
                track,
                capturedStream
            );

        });


        const offer=
            await peerConnection.createOffer();

        await peerConnection.setLocalDescription(
            offer
        );


        document.getElementById(
            "streamStatus"
        ).textContent=
            "Audio capture aktif. WebRTC siap.";


        console.log(
            "SDP OFFER:",
            offer
        );

    }catch(error){

        console.error(error);

        document.getElementById(
            "streamStatus"
        ).textContent=
            "Gagal: "+error.message;

    }

}


function stopCapture(){

    if(capturedStream){

        capturedStream
        .getTracks()
        .forEach(track=>{
            track.stop();
        });

        capturedStream=null;

    }


    if(peerConnection){

        peerConnection.close();

        peerConnection=null;

    }


    document.getElementById(
        "streamStatus"
    ).textContent=
        "Audio stream dihentikan.";

}

</script>

</body>
</html>
