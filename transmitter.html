<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVEDOW TRANSMITTER</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b10;
  color:#fff;
  padding:20px;
}
.app{
  max-width:700px;
  margin:auto;
}
h1{
  text-align:center;
  letter-spacing:3px;
}
.card{
  background:#111720;
  border:1px solid #263241;
  border-radius:16px;
  padding:18px;
  margin:15px 0;
}
input,button{
  width:100%;
  padding:13px;
  margin:6px 0;
  border-radius:9px;
  border:1px solid #334155;
  background:#0b1118;
  color:white;
}
button{
  background:#172235;
  cursor:pointer;
  font-weight:bold;
}
button:active{transform:scale(.98)}
.results button{text-align:left}
#player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
.status{
  padding:12px;
  border-radius:10px;
  background:#0b1118;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

<h1>AVEDOW TRANSMITTER</h1>

<div class="card">
  <h3>ROOM</h3>
  <input id="roomCode" placeholder="Masukkan kode room">
</div>

<div class="card">
  <h3>YOUTUBE</h3>

  <input id="apiKey" placeholder="YouTube Data API v3 Key">
  <input id="searchInput" placeholder="Cari lagu di YouTube">

  <button onclick="searchYoutube()">🔎 CARI YOUTUBE</button>

  <div id="results" class="results"></div>
</div>

<div class="card">

  <div id="player"></div>

  <button onclick="playVideo()">▶ PLAY</button>
  <button onclick="pauseVideo()">⏸ PAUSE</button>
  <button onclick="stopVideo()">⏹ STOP</button>

  <button onclick="previousVideo()">⏮ PREVIOUS</button>
  <button onclick="nextVideo()">⏭ NEXT</button>

  <label>Volume</label>
  <input
    id="volume"
    type="range"
    min="0"
    max="100"
    value="100"
    oninput="setVolume(this.value)"
  >

</div>

<div class="card">

  <h3>AUDIO STREAM</h3>

  <button onclick="startAudioStream()">
    🎙 AKTIFKAN AUDIO STREAM
  </button>

  <button onclick="stopAudioStream()">
    ⛔ MATIKAN AUDIO STREAM
  </button>

  <div id="status" class="status">
    Belum tersambung
  </div>

</div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;

let playlist = [];
let currentIndex = 0;

let localStream = null;
let peer = null;

const statusBox = document.getElementById("status");


// ============================
// YOUTUBE
// ============================

function onYouTubeIframeAPIReady(){

  player = new YT.Player("player",{
    videoId:"",
    playerVars:{
      autoplay:0,
      controls:1,
      playsinline:1
    }
  });

}


function searchYoutube(){

  const key = document.getElementById("apiKey").value.trim();
  const query = document.getElementById("searchInput").value.trim();

  if(!key){
    alert("Masukkan YouTube API Key terlebih dahulu.");
    return;
  }

  if(!query){
    alert("Masukkan kata pencarian.");
    return;
  }

  const url =
    "https://www.googleapis.com/youtube/v3/search" +
    "?part=snippet" +
    "&type=video" +
    "&maxResults=10" +
    "&q=" + encodeURIComponent(query) +
    "&key=" + encodeURIComponent(key);

  fetch(url)
  .then(r => r.json())
  .then(data => {

    const box = document.getElementById("results");
    box.innerHTML = "";

    if(!data.items){
      box.innerHTML = "<p>Hasil tidak ditemukan.</p>";
      return;
    }

    data.items.forEach(item => {

      const id = item.id.videoId;

      const button = document.createElement("button");

      button.textContent =
        item.snippet.title;

      button.onclick = () => {

        playlist.push(id);

        currentIndex =
          playlist.length - 1;

        player.loadVideoById(id);

      };

      box.appendChild(button);

    });

  })
  .catch(err => {

    console.error(err);

    alert("Gagal mencari YouTube.");

  });

}


function playVideo(){

  if(player)
    player.playVideo();

}


function pauseVideo(){

  if(player)
    player.pauseVideo();

}


function stopVideo(){

  if(player)
    player.stopVideo();

}


function setVolume(value){

  if(player)
    player.setVolume(Number(value));

}


function nextVideo(){

  if(playlist.length === 0)
    return;

  currentIndex++;

  if(currentIndex >= playlist.length)
    currentIndex = 0;

  player.loadVideoById(
    playlist[currentIndex]
  );

}


function previousVideo(){

  if(playlist.length === 0)
    return;

  currentIndex--;

  if(currentIndex < 0)
    currentIndex = playlist.length - 1;

  player.loadVideoById(
    playlist[currentIndex]
  );

}


// ============================
// AUDIO STREAM
// ============================

async function startAudioStream(){

  try{

    statusBox.textContent =
      "Meminta izin audio capture...";

    localStream =
      await navigator.mediaDevices.getDisplayMedia({

        video:true,

        audio:true

      });


    const audioTracks =
      localStream.getAudioTracks();

    if(audioTracks.length === 0){

      statusBox.textContent =
        "Audio tidak ikut tertangkap. Pilih opsi audio saat capture.";

      return;

    }


    peer =
      new RTCPeerConnection({

        iceServers:[
          {
            urls:"stun:stun.l.google.com:19302"
          }
        ]

      });


    audioTracks.forEach(track => {

      peer.addTrack(
        track,
        localStream
      );

    });


    peer.onicecandidate =
      event => {

        if(event.candidate){

          console.log(
            "ICE candidate:",
            event.candidate
          );

        }

      };


    const offer =
      await peer.createOffer();

    await peer.setLocalDescription(
      offer
    );


    console.log(
      "SDP OFFER:",
      offer.sdp
    );


    statusBox.textContent =
      "Audio stream aktif. SDP offer tersedia di console.";

  }

  catch(error){

    console.error(error);

    statusBox.textContent =
      "Audio stream gagal: " +
      error.message;

  }

}


function stopAudioStream(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

    localStream = null;

  }


  if(peer){

    peer.close();
    peer = null;

  }


  statusBox.textContent =
    "Audio stream dimatikan.";

}

</script>

</body>
</html>
