<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW TRANSMITTER</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070a0f;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.box{
  max-width:600px;
  margin:auto;
  background:#111720;
  border:1px solid #26313d;
  border-radius:22px;
  padding:20px;
}

h1{
  text-align:center;
  color:#00e5ff;
}

.status{
  padding:20px;
  margin-top:20px;
  border-radius:14px;
  background:#191f27;
  text-align:center;
  font-size:21px;
  font-weight:bold;
}

button{
  width:100%;
  border:0;
  padding:16px;
  margin-top:12px;
  border-radius:12px;
  background:#008da3;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.log{
  margin-top:15px;
  background:#05070a;
  border-radius:12px;
  padding:12px;
  height:180px;
  overflow:auto;
  color:#8eefff;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">

<h1>AVEDOW TRANSMITTER</h1>

<div id="status" class="status">
🔴 OFFLINE
</div>

<button id="connectBtn">
🔗 HUBUNGKAN RECEIVER
</button>

<button id="audioBtn">
🎵 AKTIFKAN AUDIO
</button>

<div id="log" class="log"></div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  onValue,
  onChildAdded,
  remove,
  push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

  apiKey:"ISI_API_KEY",

  authDomain:
    "ISI_PROJECT.firebaseapp.com",

  databaseURL:
    "https://ISI_PROJECT-default-rtdb.firebaseio.com",

  projectId:
    "ISI_PROJECT",

  storageBucket:
    "ISI_PROJECT.appspot.com",

  messagingSenderId:
    "ISI_SENDER_ID",

  appId:
    "ISI_APP_ID"

};


/* ===================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


/*
   CHANNEL TETAP.
   USER TIDAK PERLU MEMASUKKAN ROOM.
*/

const CHANNEL =
  "AVEDOW_AUTO_AUDIO";


let pc = null;
let stream = null;
let session = null;
let candidateListener = null;
let answerListener = null;


const status =
  document.getElementById("status");

const logBox =
  document.getElementById("log");


function log(text){

  const time =
    new Date().toLocaleTimeString();

  logBox.innerHTML +=
    `[${time}] ${text}<br>`;

  logBox.scrollTop =
    logBox.scrollHeight;
}


function setStatus(text){

  status.textContent = text;

}


/* =====================================
   HUBUNGKAN
===================================== */

async function connect(){

  if(pc){
    log("Koneksi sudah dibuat.");
    return;
  }


  setStatus(
    "🟡 MENYIAPKAN..."
  );


  /*
     Session baru mencegah offer/candidate
     lama dipakai kembali.
  */

  session =
    Date.now().toString();


  log(
    "Session: " + session
  );


  pc =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
          "stun:stun.l.google.com:19302"
        },

        {
          urls:
          "stun:stun1.l.google.com:19302"
        }

      ]

    });


  /* ===================================
     STATUS
  =================================== */

  pc.onconnectionstatechange =
  () => {

    log(
      "WebRTC: " +
      pc.connectionState
    );


    switch(pc.connectionState){

      case "new":

        setStatus(
          "🟡 MENUNGGU RECEIVER"
        );

        break;


      case "connecting":

        setStatus(
          "🔵 MENGHUBUNGKAN..."
        );

        break;


      case "connected":

        setStatus(
          "🟢 TERHUBUNG"
        );

        break;


      case "disconnected":

        setStatus(
          "🟠 KONEKSI TERGANGGU"
        );

        break;


      case "failed":

        setStatus(
          "🔴 KONEKSI GAGAL"
        );

        break;


      case "closed":

        setStatus(
          "🔴 TERPUTUS"
        );

        break;

    }

  };


  /* ===================================
     ICE TRANSMITTER
  =================================== */

  pc.onicecandidate =
  async event => {

    if(!event.candidate)
      return;


    await push(

      ref(
        db,
        `avedow/${CHANNEL}/sessions/${session}/txCandidates`
      ),

      event.candidate.toJSON()

    );

  };


  /* ===================================
     TERIMA ANSWER
  =================================== */

  answerListener =
  onValue(

    ref(
      db,
      `avedow/${CHANNEL}/sessions/${session}/answer`
    ),

    async snapshot => {

      const answer =
        snapshot.val();

      if(!answer)
        return;


      if(
        pc.signalingState !==
        "have-local-offer"
      ){

        return;

      }


      log(
        "ANSWER RECEIVER diterima."
      );


      await pc.setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );


      log(
        "Remote description siap."
      );

    }

  );


  /* ===================================
     TERIMA ICE RECEIVER
  =================================== */

  candidateListener =
  onChildAdded(

    ref(
      db,
      `avedow/${CHANNEL}/sessions/${session}/rxCandidates`
    ),

    async snapshot => {

      if(
        !pc ||
        !pc.remoteDescription
      ){

        log(
          "ICE menunggu remote description..."
        );

        return;

      }


      try{

        await pc.addIceCandidate(
          new RTCIceCandidate(
            snapshot.val()
          )
        );

      }catch(error){

        log(
          "ICE error: " +
          error.message
        );

      }

    }

  );


  /* ===================================
     BUAT OFFER
  =================================== */

  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  await set(

    ref(
      db,
      `avedow/${CHANNEL}/sessions/${session}/offer`
    ),

    {
      type:offer.type,
      sdp:offer.sdp
    }

  );


  await set(

    ref(
      db,
      `avedow/${CHANNEL}/activeSession`
    ),

    session

  );


  log(
    "OFFER dikirim."
  );


  setStatus(
    "🟡 MENUNGGU RECEIVER"
  );

}


/* =====================================
   AUDIO
===================================== */

async function startAudio(){

  if(!pc){

    alert(
      "Tekan HUBUNGKAN RECEIVER dulu."
    );

    return;

  }


  try{

    stream =
      await navigator.mediaDevices
      .getDisplayMedia({

        video:true,
        audio:true

      });


    const tracks =
      stream.getAudioTracks();


    if(
      tracks.length === 0
    ){

      alert(
        "Browser tidak memberikan audio. Saat memilih layar/tab, aktifkan Share Audio jika tersedia."
      );

      return;

    }


    for(
      const track of tracks
    ){

      pc.addTrack(
        track,
        stream
      );

    }


    log(
      "🎵 Audio track berhasil ditambahkan."
    );


    tracks[0].onended =
    () => {

      log(
        "Audio capture dihentikan."
      );

    };


  }catch(error){

    log(
      "Audio error: " +
      error.message
    );

  }

}


/* =====================================
   CONTROL COMMAND
===================================== */

onChildAdded(

  ref(
    db,
    `avedow/${CHANNEL}/commands`
  ),

  snapshot => {

    const command =
      snapshot.val();

    if(!command)
      return;


    log(
      "Command: " +
      command
    );

    /*
      Nanti tombol control bisa
      mengendalikan YouTube/player.
    */

  }

);


document
  .getElementById("connectBtn")
  .onclick =
  connect;


document
  .getElementById("audioBtn")
  .onclick =
  startAudio;

</script>

</body>
</html>
