<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW RECEIVER</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b10;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.box{
  max-width:600px;
  margin:auto;
  background:#11161d;
  border:1px solid #29313c;
  border-radius:18px;
  padding:20px;
}

h1{
  text-align:center;
  color:#00e5ff;
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#008fa3;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.status{
  margin-top:18px;
  padding:18px;
  border-radius:12px;
  text-align:center;
  background:#191f27;
  font-size:20px;
  font-weight:bold;
}

audio{
  width:100%;
  margin-top:20px;
}

.log{
  margin-top:15px;
  background:#05070a;
  padding:12px;
  border-radius:10px;
  height:180px;
  overflow:auto;
  font-size:13px;
  color:#9defff;
}
</style>
</head>

<body>

<div class="box">

<h1>AVEDOW RECEIVER</h1>

<div id="status" class="status">
🔴 BELUM TERHUBUNG
</div>

<button id="connect">
🔗 HUBUNGKAN TRANSMITTER
</button>

<audio
  id="audio"
  controls
  autoplay>
</audio>

<div id="log" class="log"></div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================
   FIREBASE CONFIG YANG SAMA
===================================== */

const firebaseConfig = {

  apiKey: "ISI_API_KEY",

  authDomain:
    "ISI_PROJECT.firebaseapp.com",

  databaseURL:
    "https://ISI_PROJECT-default-rtdb.firebaseio.com",

  projectId:
    "ISI_PROJECT",

  storageBucket:
    "ISI_PROJECT.appspot.com",

  messagingSenderId:
    "ISI_SENDER_ID",

  appId:
    "ISI_APP_ID"

};


/* ===================================== */

const CHANNEL =
  "AVEDOW_AUDIO_MAIN";


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


let pc = null;


const status =
  document.getElementById("status");

const audio =
  document.getElementById("audio");

const logBox =
  document.getElementById("log");


function log(text){

  const waktu =
    new Date().toLocaleTimeString();

  logBox.innerHTML +=
    `[${waktu}] ${text}<br>`;

  logBox.scrollTop =
    logBox.scrollHeight;
}


function setStatus(text){

  status.textContent =
    text;

}


/* =====================================
   HUBUNGKAN RECEIVER
===================================== */

async function connect(){

  setStatus(
    "🟡 MENUNGGU TRANSMITTER"
  );

  log(
    "Receiver aktif."
  );


  pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
          "stun:stun.l.google.com:19302"
        }
      ]

    });


  /* =================================
     STATUS
  ================================= */

  pc.onconnectionstatechange =
  () => {

    log(
      "Koneksi: " +
      pc.connectionState
    );


    if(
      pc.connectionState ===
      "connecting"
    ){

      setStatus(
        "🔵 MENGHUBUNGKAN..."
      );

    }


    if(
      pc.connectionState ===
      "connected"
    ){

      setStatus(
        "🟢 TERHUBUNG"
      );

    }


    if(
      pc.connectionState ===
      "disconnected" ||
      pc.connectionState ===
      "failed"
    ){

      setStatus(
        "🔴 TERPUTUS"
      );

    }

  };


  /* =================================
     TERIMA AUDIO
  ================================= */

  pc.ontrack =
  event => {

    log(
      "Audio diterima!"
    );


    audio.srcObject =
      event.streams[0];


    audio.play()
      .catch(() => {

        log(
          "Tekan PLAY pada audio."
        );

      });

  };


  /* =================================
     ICE RECEIVER
  ================================= */

  pc.onicecandidate =
  async event => {

    if(!event.candidate)
      return;


    await push(

      ref(
        db,
        `avedow/${CHANNEL}/rxCandidates`
      ),

      event.candidate.toJSON()

    );

  };


  /* =================================
     DENGARKAN OFFER
  ================================= */

  onValue(

    ref(
      db,
      `avedow/${CHANNEL}/offer`
    ),

    async snapshot => {

      const offer =
        snapshot.val();

      if(!offer)
        return;


      if(
        pc.signalingState !==
        "stable"
      ){

        return;

      }


      log(
        "Transmitter ditemukan!"
      );


      setStatus(
        "🔵 MENGHUBUNGKAN..."
      );


      await pc.setRemoteDescription(
        offer
      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      await set(

        ref(
          db,
          `avedow/${CHANNEL}/answer`
        ),

        {
          type:answer.type,
          sdp:answer.sdp
        }

      );


      log(
        "Jawaban dikirim."
      );

    }

  );


  /* =================================
     DENGARKAN ICE TRANSMITTER
  ================================= */

  onValue(

    ref(
      db,
      `avedow/${CHANNEL}/txCandidates`
    ),

    async snapshot => {

      const data =
        snapshot.val();

      if(!data)
        return;


      for(
        const key in data
      ){

        try{

          await pc.addIceCandidate(
            data[key]
          );

        }catch(e){}

      }

    }

  );

}


document
  .getElementById("connect")
  .onclick =
  connect;

</script>

</body>
</html>
