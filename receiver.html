<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AVEDOW RECEIVER</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#070a0f;
  color:white;
  font-family:Arial,sans-serif;
  padding:15px;
}

.app{
  max-width:1000px;
  margin:auto;
}

h1{
  text-align:center;
  letter-spacing:4px;
}

.card{
  background:#111720;
  border:1px solid #293444;
  border-radius:15px;
  padding:15px;
  margin:12px 0;
}

.status{
  background:#080c12;
  padding:12px;
  border-radius:9px;
}

.eq{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.band{
  text-align:center;
}

.band input{
  writing-mode:vertical-lr;
  direction:rtl;
  height:150px;
}

label{
  display:block;
  font-size:12px;
}

input[type=range]{
  width:100%;
}

canvas{
  width:100%;
  height:220px;
  background:#020406;
  border-radius:10px;
}

</style>
</head>

<body>

<div class="app">

<h1>AVEDOW RECEIVER</h1>

<div class="card">

<h3>CONNECTION</h3>

<div id="status" class="status">
Menunggu audio...
</div>

</div>


<div class="card">

<h3>10 BAND EQ</h3>

<div class="eq">

<script>

const frequencies = [
31,63,125,250,500,
1000,2000,4000,8000,16000
];

frequencies.forEach((f,i)=>{

document.write(`
<div class="band">

<label>${f} Hz</label>

<input
type="range"
min="-12"
max="12"
value="0"
id="eq${i}"
>

</div>
`);

});

</script>

</div>

</div>


<div class="card">

<h3>SPECTRUM</h3>

<canvas id="spectrum"></canvas>

</div>


<div class="card">

<h3>MASTER</h3>

<input
id="master"
type="range"
min="0"
max="1"
step="0.01"
value="1"
>

<h3>COMPRESSOR</h3>

<input
id="compressor"
type="range"
min="0"
max="1"
step="0.01"
value="0.5"
>

<h3>REVERB / DELAY</h3>

<input
id="delay"
type="range"
min="0"
max="1"
step="0.01"
value="0.25"
>

</div>

<audio
id="audio"
autoplay
controls
style="width:100%">
</audio>

</div>


<script>

let audioContext;

let source;

let analyser;

let master;

let compressor;

let delay;

let delayGain;

let eqNodes = [];


// ============================
// AUDIO ENGINE
// ============================

function createAudioEngine(stream){

  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


  source =
    audioContext.createMediaStreamSource(
      stream
    );


  // 10 BAND EQ

  frequencies.forEach((frequency,i)=>{

    const filter =
      audioContext.createBiquadFilter();

    filter.type =
      "peaking";

    filter.frequency.value =
      frequency;

    filter.Q.value =
      1;

    filter.gain.value =
      0;

    eqNodes.push(filter);

  });


  // COMPRESSOR

  compressor =
    audioContext.createDynamicsCompressor();

  compressor.threshold.value =
    -24;

  compressor.knee.value =
    20;

  compressor.ratio.value =
    8;

  compressor.attack.value =
    0.003;

  compressor.release.value =
    0.25;


  // DELAY

  delay =
    audioContext.createDelay(2);

  delay.delayTime.value =
    0.18;


  delayGain =
    audioContext.createGain();

  delayGain.gain.value =
    0.25;


  // ANALYSER

  analyser =
    audioContext.createAnalyser();

  analyser.fftSize =
    2048;


  // MASTER

  master =
    audioContext.createGain();

  master.gain.value =
    1;


  // ============================
  // ROUTING
  // ============================

  let node = source;


  eqNodes.forEach(filter =>{

    node.connect(filter);

    node = filter;

  });


  node.connect(compressor);


  compressor.connect(delay);

  delay.connect(delayGain);

  delayGain.connect(master);


  compressor.connect(master);


  master.connect(analyser);

  analyser.connect(
    audioContext.destination
  );


  setupControls();

  drawSpectrum();


  document.getElementById("status")
    .textContent =
    "Audio diterima dan DSP aktif.";

}


// ============================
// CONTROLS
// ============================

function setupControls(){

  frequencies.forEach((f,i)=>{

    document
      .getElementById("eq"+i)
      .addEventListener(
        "input",
        function(){

          eqNodes[i].gain.value =
            Number(this.value);

        }
      );

  });


  document
    .getElementById("master")
    .addEventListener(
      "input",
      function(){

        master.gain.value =
          Number(this.value);

      }
    );


  document
    .getElementById("delay")
    .addEventListener(
      "input",
      function(){

        delayGain.gain.value =
          Number(this.value);

      }
    );


  document
    .getElementById("compressor")
    .addEventListener(
      "input",
      function(){

        const value =
          Number(this.value);

        compressor.ratio.value =
          1 + value * 19;

      }
    );

}


// ============================
// SPECTRUM
// ============================

function drawSpectrum(){

  const canvas =
    document.getElementById(
      "spectrum"
    );

  const ctx =
    canvas.getContext("2d");


  function draw(){

    requestAnimationFrame(draw);

    if(!analyser)
      return;


    const buffer =
      new Uint8Array(
        analyser.frequencyBinCount
      );


    analyser.getByteFrequencyData(
      buffer
    );


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    const barWidth =
      canvas.width /
      buffer.length *
      2.5;


    let x = 0;


    for(let i=0;
        i<buffer.length;
        i++){

      const barHeight =
        buffer[i] *
        canvas.height /
        255;


      ctx.fillStyle =
        "#19ff88";


      ctx.fillRect(
        x,
        canvas.height-barHeight,
        barWidth,
        barHeight
      );


      x += barWidth + 1;

      if(x > canvas.width)
        break;

    }

  }


  draw();

}


// ============================
// WEBRTC RECEIVER
// ============================

const peer =
  new RTCPeerConnection({

    iceServers:[
      {
        urls:
        "stun:stun.l.google.com:19302"
      }
    ]

  });


peer.ontrack =
  event => {

    const stream =
      event.streams[0];

    const audio =
      document.getElementById(
        "audio"
      );

    audio.srcObject =
      stream;


    createAudioEngine(
      stream
    );

  };


peer.onconnectionstatechange =
  () => {

    document.getElementById(
      "status"
    ).textContent =
      "WebRTC: " +
      peer.connectionState;

  };

</script>

</body>
</html>
