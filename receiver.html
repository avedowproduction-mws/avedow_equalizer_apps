<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW RECEIVER</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#070a0f;
 color:white;
 font-family:Arial,sans-serif;
}

.app{
 width:min(1100px,95%);
 margin:auto;
 padding:15px;
}

h1{
 text-align:center;
 letter-spacing:3px;
}

.card{
 background:#111720;
 border:1px solid #293444;
 border-radius:16px;
 padding:16px;
 margin:12px 0;
}

input,button{
 width:100%;
 padding:12px;
 margin:5px 0;
 border-radius:9px;
 border:1px solid #344154;
 background:#090f16;
 color:white;
}

button{
 background:#172235;
 font-weight:bold;
}

.status{
 padding:12px;
 background:#080c12;
 border-radius:8px;
}

.eq{
 display:grid;
 grid-template-columns:repeat(10,1fr);
 gap:8px;
}

.band{
 text-align:center;
 font-size:11px;
}

.band input{
 height:150px;
 writing-mode:vertical-lr;
 direction:rtl;
}

canvas{
 width:100%;
 height:250px;
 background:#020406;
 border-radius:10px;
}

@media(max-width:700px){
 .eq{
   grid-template-columns:repeat(5,1fr);
 }
}
</style>
</head>

<body>

<div class="app">

<h1>AVEDOW RECEIVER</h1>

<div class="card">

<h3>ROOM</h3>

<input
 id="room"
 placeholder="Masukkan kode room"
>

<button onclick="connectReceiver()">
🔗 CONNECT
</button>

<div id="status" class="status">
Menunggu...
</div>

</div>


<div class="card">

<h3>10 BAND EQ</h3>

<div class="eq">

<div class="band">
31 Hz
<input id="eq0" type="range" min="-12" max="12" value="0">
</div>

<div class="band">
63 Hz
<input id="eq1" type="range" min="-12" max="12" value="0">
</div>

<div class="band">
125 Hz
<input id="eq2" type="range" min="-12" max="12" value="0">
</div>

<div class="band">
250 Hz
<input id="eq3" type="range" min="-12" max="12" value="0">
</div>

<div class="band">
500 Hz
<input id="eq4" type="range" min="-12" max="12" value="0">
</div>

<div class="band">
1K
<input id="eq5" type="range" min="-12" max="12" value="0">
</div>

<div class="band">
2K
<input id="eq6" type="range" min="-12" max="12" value="0">
</div>

<div class="band">
4K
<input id="eq7" type="range" min="-12" max="12" value="0">
</div>

<div class="band">
8K
<input id="eq8" type="range" min="-12" max="12" value="0">
</div>

<div class="band">
16K
<input id="eq9" type="range" min="-12" max="12" value="0">
</div>

</div>
</div>


<div class="card">

<h3>SPECTRUM ANALYZER</h3>

<canvas id="spectrum"></canvas>

</div>


<div class="card">

<h3>COMPRESSOR</h3>

<input
 id="compression"
 type="range"
 min="1"
 max="20"
 value="8"
 step=".1"
>

<h3>REVERB</h3>

<input
 id="reverb"
 type="range"
 min="0"
 max="1"
 value=".2"
 step=".01"
>

<h3>DELAY</h3>

<input
 id="delay"
 type="range"
 min="0"
 max="1"
 value=".2"
 step=".01"
>

<h3>MASTER</h3>

<input
 id="master"
 type="range"
 min="0"
 max="1"
 value="1"
 step=".01"
>

</div>

<audio
 id="audio"
 autoplay
 controls
 style="width:100%"
></audio>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
 apiKey:"ISI_API_KEY_FIREBASE",
 authDomain:"ISI_PROJECT.firebaseapp.com",
 databaseURL:"https://ISI_PROJECT-default-rtdb.firebaseio.com",
 projectId:"ISI_PROJECT",
 storageBucket:"ISI_PROJECT.appspot.com",
 messagingSenderId:"ISI_SENDER_ID",
 appId:"ISI_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

let room="";
let pc=null;

let audioContext;
let source;
let analyser;
let master;
let compressor;
let delayNode;
let delayGain;

let eqNodes=[];

const frequencies=[
 31,63,125,250,500,
 1000,2000,4000,8000,16000
];


/* ================= CONNECT ================= */

async function connectReceiver(){

 room=document.getElementById("room").value.trim();

 if(!room){
   alert("Masukkan room.");
   return;
 }


 pc=new RTCPeerConnection({
   iceServers:[
     {
       urls:"stun:stun.l.google.com:19302"
     }
   ]
 });


 pc.ontrack=event=>{

   const stream=event.streams[0];

   const audio=
     document.getElementById("audio");

   audio.srcObject=stream;

   startAudioEngine(stream);

 };


 pc.onicecandidate=event=>{

   if(event.candidate){

     db.ref(
       "avedow/"+room+
       "/receiver/candidates"
     ).push(
       event.candidate.toJSON()
     );

   }

 };


 /* GET TRANSMITTER OFFER */

 db.ref(
   "avedow/"+room+
   "/transmitter/offer"
 ).on("value",async snap=>{

   const offer=snap.val();

   if(!offer)return;

   try{

     await pc.setRemoteDescription(
       new RTCSessionDescription(offer)
     );


     const answer=
       await pc.createAnswer();


     await pc.setLocalDescription(answer);


     await db.ref(
       "avedow/"+room+
       "/receiver/answer"
     ).set({
       type:answer.type,
       sdp:answer.sdp
     });


     document.getElementById(
       "status"
     ).textContent=
       "Receiver tersambung.";

   }catch(e){

     console.error(e);

   }

 });


 /* GET TRANSMITTER ICE */

 db.ref(
   "avedow/"+room+
   "/transmitter/candidates"
 ).on("child_added",async snap=>{

   try{

     await pc.addIceCandidate(
       new RTCIceCandidate(
         snap.val()
       )
     );

   }catch(e){

     console.error(e);

   }

 });


 /* ONLINE */

 db.ref(
   "avedow/"+room+
   "/receiver"
 ).update({
   online:true,
   time:Date.now()
 });


 listenCommands();

}


/* ================= COMMANDS ================= */

function listenCommands(){

 db.ref(
   "avedow/"+room+
   "/commands"
 ).on("child_added",snap=>{

   const cmd=snap.val();

   console.log(
     "COMMAND:",
     cmd
   );

   /*
    Receiver menerima perintah.
    Audio sendiri tetap berasal dari WebRTC.
   */

 });

}


/* ================= AUDIO DSP ================= */

function startAudioEngine(stream){

 if(audioContext){
   audioContext.close();
 }


 audioContext=
 new(
   window.AudioContext ||
   window.webkitAudioContext
 )();


 source=
 audioContext.createMediaStreamSource(
   stream
 );


 eqNodes=[];


 frequencies.forEach(freq=>{

   const filter=
     audioContext.createBiquadFilter();

   filter.type="peaking";
   filter.frequency.value=freq;
   filter.Q.value=1;
   filter.gain.value=0;

   eqNodes.push(filter);

 });


 compressor=
 audioContext.createDynamicsCompressor();

 compressor.threshold.value=-24;
 compressor.knee.value=20;
 compressor.ratio.value=8;
 compressor.attack.value=.003;
 compressor.release.value=.25;


 delayNode=
 audioContext.createDelay(2);

 delayNode.delayTime.value=.18;


 delayGain=
 audioContext.createGain();

 delayGain.gain.value=.2;


 analyser=
 audioContext.createAnalyser();

 analyser.fftSize=2048;


 master=
 audioContext.createGain();

 master.gain.value=1;


 let node=source;


 eqNodes.forEach(filter=>{

   node.connect(filter);

   node=filter;

 });


 node.connect(compressor);

 compressor.connect(master);

 compressor.connect(delayNode);

 delayNode.connect(delayGain);

 delayGain.connect(master);

 master.connect(analyser);

 analyser.connect(
   audioContext.destination
 );


 setupControls();

 drawSpectrum();

}


/* ================= CONTROLS ================= */

function setupControls(){

 eqNodes.forEach((node,i)=>{

   document.getElementById(
     "eq"+i
   ).oninput=function(){

     node.gain.value=
       Number(this.value);

   };

 });


 document.getElementById(
   "master"
 ).oninput=function(){

   master.gain.value=
     Number(this.value);

 };


 document.getElementById(
   "delay"
 ).oninput=function(){

   delayGain.gain.value=
     Number(this.value);

 };


 document.getElementById(
   "compression"
 ).oninput=function(){

   compressor.ratio.value=
     Number(this.value);

 };


 document.getElementById(
   "reverb"
 ).oninput=function(){

   /*
    Mengatur jumlah efek delay
    sebagai ambience/reverb sederhana.
   */

   delayGain.gain.value=
     Number(this.value);

 };

}


/* ================= SPECTRUM ================= */

function drawSpectrum(){

 const canvas=
   document.getElementById(
     "spectrum"
   );

 const ctx=
   canvas.getContext("2d");


 function draw(){

   requestAnimationFrame(draw);

   if(!analyser)return;


   const data=
     new Uint8Array(
       analyser.frequencyBinCount
     );


   analyser.getByteFrequencyData(
     data
   );


   ctx.clearRect(
     0,0,
     canvas.width,
     canvas.height
   );


   const width=
     canvas.width/data.length*3;

   let x=0;


   for(let i=0;i<data.length;i++){

     const height=
       data[i]*
       canvas.height/
       255;


     ctx.fillStyle="#00ff88";


     ctx.fillRect(
       x,
       canvas.height-height,
       width,
       height
     );


     x+=width+1;

     if(x>canvas.width)
       break;

   }

 }

 draw();

}

</script>

</body>
</html>
