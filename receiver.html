<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW RECEIVER</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070a0f;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.box{
  max-width:600px;
  margin:auto;
  background:#111720;
  border:1px solid #26313d;
  border-radius:22px;
  padding:20px;
}

h1{
  text-align:center;
  color:#00e5ff;
}

.status{
  padding:20px;
  margin-top:20px;
  border-radius:14px;
  background:#191f27;
  text-align:center;
  font-size:21px;
  font-weight:bold;
}

button{
  width:100%;
  border:0;
  padding:16px;
  margin-top:12px;
  border-radius:12px;
  background:#008da3;
  color:white;
  font-size:17px;
  font-weight:bold;
}

audio{
  width:100%;
  margin-top:18px;
}

.log{
  margin-top:15px;
  background:#05070a;
  border-radius:12px;
  padding:12px;
  height:180px;
  overflow:auto;
  color:#8eefff;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">

<h1>AVEDOW RECEIVER</h1>

<div id="status" class="status">
🔴 OFFLINE
</div>

<button id="connectBtn">
🔗 HUBUNGKAN TRANSMITTER
</button>

<audio
  id="audio"
  controls
  autoplay>
</audio>

<div id="log" class="log"></div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================
   FIREBASE CONFIG
   HARUS SAMA
===================================== */

const firebaseConfig = {

  apiKey:"ISI_API_KEY",

  authDomain:
    "ISI_PROJECT.firebaseapp.com",

  databaseURL:
    "https://ISI_PROJECT-default-rtdb.firebaseio.com",

  projectId:
    "ISI_PROJECT",

  storageBucket:
    "ISI_PROJECT.appspot.com",

  messagingSenderId:
    "ISI_SENDER_ID",

  appId:
    "ISI_APP_ID"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


const CHANNEL =
  "AVEDOW_AUTO_AUDIO";


let pc = null;
let session = null;

let pendingCandidates = [];


const status =
  document.getElementById("status");

const audio =
  document.getElementById("audio");

const logBox =
  document.getElementById("log");


function log(text){

  const time =
    new Date().toLocaleTimeString();

  logBox.innerHTML +=
    `[${time}] ${text}<br>`;

  logBox.scrollTop =
    logBox.scrollHeight;
}


function setStatus(text){

  status.textContent =
    text;

}


/* =====================================
   HUBUNGKAN
===================================== */

async function connect(){

  if(pc){

    log(
      "Receiver sudah aktif."
    );

    return;

  }


  setStatus(
    "🟡 MENUNGGU TRANSMITTER"
  );


  log(
    "Receiver aktif."
  );


  /*
     Pantau session aktif.
  */

  onValue(

    ref(
      db,
      `avedow/${CHANNEL}/activeSession`
    ),

    async snapshot => {

      const newSession =
        snapshot.val();

      if(!newSession)
        return;


      if(
        session === newSession
      ){

        return;

      }


      session =
        newSession;


      log(
        "Session transmitter ditemukan: " +
        session
      );


      await createReceiver();

    }

  );

}


/* =====================================
   BUAT RECEIVER
===================================== */

async function createReceiver(){

  pc =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
          "stun:stun.l.google.com:19302"
        },

        {
          urls:
          "stun:stun1.l.google.com:19302"
        }

      ]

    });


  /* ===================================
     STATUS
  =================================== */

  pc.onconnectionstatechange =
  () => {

    log(
      "WebRTC: " +
      pc.connectionState
    );


    if(
      pc.connectionState ===
      "connecting"
    ){

      setStatus(
        "🔵 MENGHUBUNGKAN..."
      );

    }


    if(
      pc.connectionState ===
      "connected"
    ){

      setStatus(
        "🟢 TERHUBUNG"
      );

    }


    if(
      pc.connectionState ===
      "disconnected"
    ){

      setStatus(
        "🟠 KONEKSI TERGANGGU"
      );

    }


    if(
      pc.connectionState ===
      "failed"
    ){

      setStatus(
        "🔴 KONEKSI GAGAL"
      );

    }

  };


  /* ===================================
     TERIMA AUDIO
  =================================== */

  pc.ontrack =
  event => {

    log(
      "🎵 AUDIO DITERIMA!"
    );


    audio.srcObject =
      event.streams[0];


    audio.play()
      .catch(() => {

        log(
          "Tekan PLAY pada audio."
        );

      });

  };


  /* ===================================
     ICE RECEIVER
  =================================== */

  pc.onicecandidate =
  async event => {

    if(!event.candidate)
      return;


    await set(

      ref(
        db,
        `avedow/${CHANNEL}/sessions/${session}/rxCandidates/${event.candidate.sdpMLineIndex}_${Date.now()}`
      ),

      event.candidate.toJSON()

    );

  };


  /* ===================================
     AMBIL OFFER
  =================================== */

  const offerSnapshot =
    await new Promise(resolve => {

      onValue(

        ref(
          db,
          `avedow/${CHANNEL}/sessions/${session}/offer`
        ),

        snap => {

          if(
            snap.exists()
          ){

            resolve(snap);

          }

        },

        {
          onlyOnce:true
        }

      );

    });


  const offer =
    offerSnapshot.val();


  if(!offer){

    log(
      "Offer tidak ditemukan."
    );

    return;

  }


  await pc.setRemoteDescription(

    new RTCSessionDescription(
      offer
    )

  );


  log(
    "Remote description siap."
  );


  /*
     Candidate transmitter.
     Sekarang remoteDescription sudah siap,
     jadi candidate aman diproses.
  */

  onChildAdded(

    ref(
      db,
      `avedow/${CHANNEL}/sessions/${session}/txCandidates`
    ),

    async snapshot => {

      try{

        await pc.addIceCandidate(

          new RTCIceCandidate(
            snapshot.val()
          )

        );

      }catch(error){

        log(
          "ICE error: " +
          error.message
        );

      }

    }

  );


  /* ===================================
     BUAT ANSWER
  =================================== */

  const answer =
    await pc.createAnswer();


  await pc.setLocalDescription(
    answer
  );


  await set(

    ref(
      db,
      `avedow/${CHANNEL}/sessions/${session}/answer`
    ),

    {
      type:answer.type,
      sdp:answer.sdp
    }

  );


  log(
    "ANSWER dikirim."
  );

}


document
  .getElementById("connectBtn")
  .onclick =
  connect;

</script>

</body>
</html>
