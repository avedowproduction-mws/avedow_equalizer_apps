<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW RECEIVER</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b10;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.box{
  max-width:600px;
  margin:auto;
  background:#11161d;
  border:1px solid #29313c;
  border-radius:18px;
  padding:20px;
}

h1{
  text-align:center;
  color:#00e5ff;
}

input,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #394451;
  background:#080b10;
  color:white;
  font-size:16px;
}

button{
  background:#008fa3;
  border:0;
  font-weight:bold;
}

.status{
  margin-top:18px;
  padding:18px;
  border-radius:12px;
  text-align:center;
  background:#191f27;
  font-size:20px;
  font-weight:bold;
}

audio{
  width:100%;
  margin-top:20px;
}

.log{
  margin-top:15px;
  background:#05070a;
  padding:12px;
  border-radius:10px;
  height:180px;
  overflow:auto;
  font-size:13px;
  color:#9defff;
}
</style>
</head>

<body>

<div class="box">

<h1>AVEDOW RECEIVER</h1>

<input
  id="room"
  placeholder="Masukkan ROOM yang sama"
/>

<button id="connectBtn">
HUBUNGKAN TRANSMITTER
</button>

<div id="status" class="status">
🔴 OFFLINE
</div>

<audio
  id="audio"
  autoplay
  controls>
</audio>

<div id="log" class="log"></div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================================
   FIREBASE CONFIG YANG SAMA DENGAN TRANSMITTER
========================================= */

const firebaseConfig = {
  apiKey: "ISI_API_KEY",
  authDomain: "ISI_PROJECT.firebaseapp.com",
  databaseURL: "https://ISI_PROJECT-default-rtdb.firebaseio.com",
  projectId: "ISI_PROJECT",
  storageBucket: "ISI_PROJECT.appspot.com",
  messagingSenderId: "ISI_SENDER_ID",
  appId: "ISI_APP_ID"
};


/* ========================================= */

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let pc = null;
let roomCode = "";

const audio =
  document.getElementById("audio");

const statusBox =
  document.getElementById("status");

const logBox =
  document.getElementById("log");


function log(text){

  const time =
    new Date().toLocaleTimeString();

  logBox.innerHTML +=
    `[${time}] ${text}<br>`;

  logBox.scrollTop =
    logBox.scrollHeight;
}


function status(text){

  statusBox.textContent = text;

}


/* =========================================
   MULAI RECEIVER
========================================= */

async function startReceiver(){

  roomCode =
    document
      .getElementById("room")
      .value
      .trim();

  if(!roomCode){

    alert("Masukkan ROOM terlebih dahulu");

    return;
  }


  status("🟡 MENUNGGU TRANSMITTER");

  log("Receiver aktif");


  pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
          "stun:stun.l.google.com:19302"
        }
      ]

    });


  /* =====================================
     STATUS WEBRTC
  ===================================== */

  pc.onconnectionstatechange = () => {

    log(
      "WebRTC: " +
      pc.connectionState
    );


    if(
      pc.connectionState ===
      "connecting"
    ){

      status(
        "🔵 MENGHUBUNGKAN..."
      );

    }


    if(
      pc.connectionState ===
      "connected"
    ){

      status(
        "🟢 TERHUBUNG"
      );

    }


    if(
      pc.connectionState ===
      "disconnected" ||
      pc.connectionState ===
      "failed" ||
      pc.connectionState ===
      "closed"
    ){

      status(
        "🔴 TERPUTUS"
      );

    }

  };


  pc.oniceconnectionstatechange =
  () => {

    log(
      "ICE: " +
      pc.iceConnectionState
    );

  };


  /* =====================================
     AUDIO DARI TRANSMITTER
  ===================================== */

  pc.ontrack = event => {

    log("Audio dari transmitter diterima");

    audio.srcObject =
      event.streams[0];

    audio.play()
      .catch(() => {

        log(
          "Tekan tombol play pada audio"
        );

      });

  };


  /* =====================================
     ICE RECEIVER
  ===================================== */

  pc.onicecandidate =
  async event => {

    if(event.candidate){

      await push(
        ref(
          db,
          `avedow/${roomCode}/receiverCandidates`
        ),
        event.candidate.toJSON()
      );

    }

  };


  /* =====================================
     DENGARKAN OFFER TRANSMITTER
  ===================================== */

  onValue(

    ref(
      db,
      `avedow/${roomCode}/transmitterOffer`
    ),

    async snapshot => {

      const offer =
        snapshot.val();

      if(!offer) return;


      if(
        pc.signalingState !==
        "stable"
      ){

        return;

      }


      log(
        "OFFER dari transmitter diterima"
      );

      status(
        "🔵 MENGHUBUNGKAN..."
      );


      await pc.setRemoteDescription(

        new RTCSessionDescription(
          offer
        )

      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      await set(

        ref(
          db,
          `avedow/${roomCode}/receiverAnswer`
        ),

        {
          type: answer.type,
          sdp: answer.sdp
        }

      );


      log(
        "ANSWER dikirim ke transmitter"
      );

    }

  );


  /* =====================================
     DENGARKAN ICE TRANSMITTER
  ===================================== */

  onValue(

    ref(
      db,
      `avedow/${roomCode}/transmitterCandidates`
    ),

    async snapshot => {

      const data =
        snapshot.val();

      if(!data) return;


      for(
        const key in data
      ){

        try{

          await pc.addIceCandidate(

            new RTCIceCandidate(
              data[key]
            )

          );

        }catch(error){

          console.log(error);

        }

      }

    }

  );

}


document
  .getElementById("connectBtn")
  .onclick =
  startReceiver;

</script>

</body>
</html>
