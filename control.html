<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW CONTROL</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070a0f;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.box{
  max-width:500px;
  margin:auto;
  background:#111720;
  border:1px solid #26313d;
  border-radius:22px;
  padding:20px;
}

h1{
  text-align:center;
  color:#00e5ff;
}

button{
  width:100%;
  padding:17px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#008da3;
  color:white;
  font-size:17px;
  font-weight:bold;
}

input{
  width:100%;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>AVEDOW CONTROL</h1>

<button onclick="sendCommand('previous')">
⏮ PREVIOUS
</button>

<button onclick="sendCommand('play')">
▶ PLAY
</button>

<button onclick="sendCommand('pause')">
⏸ PAUSE
</button>

<button onclick="sendCommand('next')">
⏭ NEXT
</button>

<button onclick="sendCommand('mute')">
🔇 MUTE
</button>

<input
  id="volume"
  type="range"
  min="0"
  max="100"
  value="100"
  oninput="volumeChange(this.value)"
>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

  apiKey:"ISI_API_KEY",

  authDomain:
    "ISI_PROJECT.firebaseapp.com",

  databaseURL:
    "https://ISI_PROJECT-default-rtdb.firebaseio.com",

  projectId:
    "ISI_PROJECT",

  storageBucket:
    "ISI_PROJECT.appspot.com",

  messagingSenderId:
    "ISI_SENDER_ID",

  appId:
    "ISI_APP_ID"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


const CHANNEL =
  "AVEDOW_AUTO_AUDIO";


window.sendCommand =
async function(command){

  await push(

    ref(
      db,
      `avedow/${CHANNEL}/commands`
    ),

    command

  );

};


window.volumeChange =
async function(value){

  await push(

    ref(
      db,
      `avedow/${CHANNEL}/commands`
    ),

    "volume:" + value

  );

};

</script>

</body>
</html>
