<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW AUDIO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#080b10;
  color:white;
  font-family:Arial,sans-serif;
}
.box{
  width:min(430px,92%);
  padding:25px;
  background:#111720;
  border:1px solid #293444;
  border-radius:20px;
  text-align:center;
}
h1{letter-spacing:4px}
p{color:#9aa7b8}
button{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #344154;
  border-radius:10px;
  background:#172235;
  color:white;
  font-weight:bold;
  font-size:15px;
}
button:active{transform:scale(.98)}
</style>
</head>

<body>

<div class="box">
  <h1>AVEDOW</h1>
  <p>AUDIO SYSTEM</p>

  <button onclick="location.href='transmitter.html'">
    📡 TRANSMITTER
  </button>

  <button onclick="location.href='receiver.html'">
    🔊 RECEIVER
  </button>

  <button onclick="location.href='control.html'">
    🎛️ CONTROL
  </button>
</div>

</body>
</html>
